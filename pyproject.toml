[project]
name = "agent-voice"
version = "0.1.0"
description = "Local, agent-first text to speech with measured word timestamps: OmniVoice for the voice, Whisper for the timing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
  "omnivoice==0.2.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "soundfile==0.13.1",
  "transformers==5.22.1",
  "huggingface_hub==2.4.0",
]

[project.scripts]
agent-voice = "agent_voice.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
